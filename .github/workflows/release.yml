name: Release

# Build installers for every platform on every push to main (downloadable from
# the run's artifacts) and publish a GitHub Release when there is a new version:
#   - push to main whose package.json version has no release yet → tag vX.Y.Z on
#     that commit and publish it. Releasing = bumping "version" and merging.
#   - push of a v* tag → publish that tag (the manual path still works).
# The in-app updater reads these releases (REPO in src/shared/updateState.ts).
# Run manually (workflow_dispatch) to dry-build without publishing.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Site, blog and SEO content ship through their own workflows; a commit that
    # only touches them changes nothing in the installers. (Tag pushes are not
    # filtered by paths, so a release always builds.)
    paths-ignore:
      - "docs/**"
      - "blog/**"
      - "seo/**"
      - "**/*.md"
  workflow_dispatch:

# A newer push to main supersedes a build still running for an older one. Tag
# builds are never cancelled: each one is a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, to tell a new version from a released one
      - id: v
        name: Decide whether this run publishes
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              release=true
            elif [[ "$(git rev-list -n 1 "$tag")" == "$GITHUB_SHA" ]]; then
              release=true # a re-run of the commit that version was tagged on
            else
              # This fork carries the upstream tags (v0.5.2, v0.5.3, …). Publishing
              # onto one would ship another commit's tag, so say so and skip.
              echo "::notice::$tag already exists on another commit; bump \"version\" in package.json to publish a release."
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "$tag → release=$release"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-2022
            args: --win
          - os: ubuntu-24.04
            args: --linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # node-gyp (used to rebuild native node-pty) imports distutils, which was
      # removed in Python 3.12. Pin 3.11 and install setuptools so the distutils
      # shim is available across all runners.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      # Licensed art (LimeZu) lives in the private ZerogeWorkshop/assets repo and
      # only enters the installers (tools/zw-assets.cjs). ASSETS_TOKEN: a
      # fine-grained token with read access to that repo's contents. Without it
      # (forks) the app builds with its free art.
      - name: Licensed art available?
        id: zwassets
        shell: bash
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: echo "present=$([ -n "$ASSETS_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Fetch licensed art (private assets repo)
        if: steps.zwassets.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ZerogeWorkshop/assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: zw-assets
          sparse-checkout: atlases
          persist-credentials: false

      # No analytics in this fork's builds: electron.vite.config.ts pins the
      # key empty (src/shared/fork.ts), so nothing is injected here.
      - name: Compile (electron-vite → out/)
        run: npm run build
        env:
          ZW_ASSETS: ${{ steps.zwassets.outputs.present == 'true' && format('{0}/zw-assets', github.workspace) || '' }}

      # Current NSIS for the Windows installers (why: electron-builder.yml, nsis).
      # The official 3.11 zip, plus elevate.exe from electron-builder's own NSIS
      # bundle (electron-builder copies it into the app); all three pinned.
      - name: Current NSIS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          t="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL --retry 3 -o "$t/nsis.zip" "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip"
          echo "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1  $t/nsis.zip" | sha256sum -c -
          unzip -q "$t/nsis.zip" -d "$t"
          curl -fsSL --retry 3 -o "$t/eb-nsis.7z" "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z"
          echo "9877df902530f96357d13a7a31ae2b9df67f48b11ffc9a1700a7c961574ec5fa  $t/eb-nsis.7z" | sha256sum -c -
          7z e -y -o"$t/nsis-3.11" "$t/eb-nsis.7z" elevate.exe > /dev/null
          echo "9b1fbf0c11c520ae714af8aa9af12cfd48503eedecd7398d8992ee94d1b4dc37  $t/nsis-3.11/elevate.exe" | sha256sum -c -
          echo "ELECTRON_BUILDER_NSIS_DIR=$(cygpath -w "$t/nsis-3.11")" >> "$GITHUB_ENV"

      - name: Package installers
        # GH_TOKEN lets electron-builder skip its own publish; we upload via the
        # release step below for full control over the asset set.
        shell: bash
        run: |
          # An EMPTY CSC_LINK is not "no certificate" to electron-builder: it
          # resolves '' to the project folder and fails with "<repo> not a file"
          # (this fork has no Apple secrets, so every expression below is '').
          # Drop the empty ones and skip identity discovery: unsigned build.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization — MUST be macOS-only. CSC_LINK is the
          # Apple Developer ID .p12; if it leaks into the Windows/Linux runners,
          # electron-builder tries to sign those targets with the mac cert and the
          # build hard-fails ("cannot extract publisher name"). So gate on the OS.
          #   APPLE_CERTIFICATE_P12       = base64 of the "Developer ID Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD  = that .p12's export password (REQUIRED if P12 set,
          #                                 else electron-builder imports with an empty
          #                                 password and fails "MAC verification failed")
          # All optional: with the secrets unset every runner builds unsigned and stays green.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          # hash only the distributable artifacts, not blockmaps/yml
          files=$(ls *.dmg *.zip *.exe *.AppImage 2>/dev/null || true)
          [ -z "$files" ] && { echo "no artifacts to hash"; exit 0; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $files > "SHA256SUMS-${{ matrix.os }}.txt"
          else
            shasum -a 256 $files > "SHA256SUMS-${{ matrix.os }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-dist
          # zip + latest*.yml + blockmaps feed electron-updater (auto-update):
          # latest-mac.yml points Squirrel.Mac at the zip; nsis/AppImage use
          # latest.yml/latest-linux.yml + blockmaps for differential download.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
            dist/fork*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn

  server:
    name: Server (${{ matrix.arch }})
    needs: version
    # The GUI-less server (src/server): a tarball per architecture with its
    # native modules prebuilt for Node 22 on Ubuntu 22.04 (glibc 2.35, so it
    # runs on 22.04+ and Debian 12+). Smoke-tested here on a real Ubuntu:
    # office up, orchestrator spawned, SIGTERM shuts it down.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (no Electron)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck:server
      - name: Build
        run: |
          node tools/build-server.cjs
          cd out/server && npm install --omit=dev --no-audit --no-fund
      - name: Smoke test
        run: node tools/server-smoke.cjs
      - name: Package
        shell: bash
        run: |
          version="${{ needs.version.outputs.tag }}"
          name="scranton-branch-server-${version#v}-linux-${{ matrix.arch }}"
          mkdir -p dist
          rm -f out/server/index.cjs.map
          tar -C out -czf "dist/$name.tar.gz" --transform "s|^server|$name|" server
          (cd dist && sha256sum "$name.tar.gz" > "SHA256SUMS-server-${{ matrix.arch }}.txt")
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-server-*.txt

  publish:
    name: Publish release
    needs: [version, build, server]
    # Not held back by one platform's build: GitHub's macOS arm64 runners can go
    # a whole day without capacity ("not acquired by Runner … even after multiple
    # attempts"), and Windows and Linux users waited for nothing. The check below
    # still requires Windows, Linux and the server; "Re-run failed jobs" later
    # builds the Mac and runs this job again, which adds its files to the same
    # release (action-gh-release updates an existing one).
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.version.result == 'success' && needs.server.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Require the Windows and Linux builds
        shell: bash
        run: |
          ok=1
          for want in '*-win-x64-setup.exe' '*.AppImage' 'latest.yml' 'latest-linux.yml'; do
            if [ -z "$(find artifacts -type f -name "$want" | head -1)" ]; then echo "::error::missing $want"; ok=0; fi
          done
          [ "$ok" = 1 ] || exit 1
          if [ -z "$(find artifacts -type f -name '*.dmg' | head -1)" ]; then
            echo "::warning::No macOS build in this run: publishing without it. Re-run the failed jobs to add it."
          fi

      - name: Flatten + merge checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.blockmap' -o -name 'latest*.yml' -o -name 'fork*.yml' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS-*.txt > release/SHA256SUMS.txt 2>/dev/null || true
          # Windows: uninstall without the (unsigned) uninstaller, for machines
          # whose endpoint security blocks it. See tools/windows/.
          cp tools/windows/uninstall-scranton-branch.ps1 tools/windows/uninstall-scranton-branch.cmd release/
          ls -la release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # FORK-RELEASE.md is the human-facing notes; GitHub shows it as the body.
          body_path: FORK-RELEASE.md
          # A tag carrying a pre-release suffix (v0.4.4-rc.1, -beta.2 …) publishes
          # as a PRE-RELEASE. This is load-bearing, not cosmetic: the in-app
          # updater polls /releases/latest, and GitHub excludes pre-releases from
          # that endpoint. So an rc gets a real, public, shareable download page
          # WITHOUT offering itself to every installed copy of the app — which is
          # exactly what you want for a build that needs testing on a platform the
          # authors cannot run. A clean `vX.Y.Z` tag is unaffected and still ships
          # as the latest release to everyone.
          tag_name: ${{ needs.version.outputs.tag }}
          # Creates the tag on this commit when a main push is releasing a new
          # version; ignored when the tag already exists (a tag push).
          target_commitish: ${{ github.sha }}
          # Fork patches (-fork.N) are full releases: /releases/latest must
          # return them. Only -rc/-beta/-alpha builds are pre-releases.
          prerelease: ${{ contains(needs.version.outputs.tag, '-rc.') || contains(needs.version.outputs.tag, '-beta.') || contains(needs.version.outputs.tag, '-alpha.') }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/fork*.yml
            release/*.tar.gz
            release/SHA256SUMS.txt
            release/uninstall-scranton-branch.ps1
            release/uninstall-scranton-branch.cmd
