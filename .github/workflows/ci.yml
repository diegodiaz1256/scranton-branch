name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Manual runs: a fork's automatic triggers stay paused until its owner enables
  # workflows in the Actions tab, and a run is sometimes wanted on demand anyway.
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck
    # Linux: nothing here needs a Mac, and this blocking check was cancelled
    # whenever GitHub's macOS runners ran out of capacity.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No native rebuild: tsc and the link check never load node-pty.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links

  # The node:test suite (test/*.test.cjs). Windows is where most users run the
  # app; Linux catches path and shell assumptions that only hold on Windows.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The release job's runners, which have the toolchain node-pty builds with.
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # node-gyp (node-pty's rebuild) imports distutils, gone in Python 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools
      # A full install: some tests start real terminals (node-pty) and one runs
      # the Electron binary, both of which come from install scripts.
      - name: Install dependencies
        run: npm ci
      # Git commits made by tests need an identity, and must not try to sign.
      - name: Git identity for test repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global commit.gpgsign false
      # bash on both runners: node 20 does not expand the glob itself. Linux has
      # no display, so the Electron test gets a virtual one.
      - name: Run the suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node --test test/*.test.cjs
          else
            node --test test/*.test.cjs
          fi

  build:
    name: Build
    runs-on: macos-latest
    # Build exercises the native node-pty rebuild; allowed to fail without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
