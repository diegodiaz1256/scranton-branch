appId: io.github.diegodiaz1256.scrantonbranch
productName: Scranton Branch
copyright: Copyright © 2026 Chaitanya Giri and the Scranton Branch contributors

# Where electron-updater looks for new versions (latest*.yml + assets on GitHub
# releases). The release workflow still uploads assets itself (--publish never);
# this block only stamps app-update.yml into the packaged app so the updater
# knows which repo to poll.
publish:
  provider: github
  # Must match REPO in src/shared/updateState.ts.
  owner: diegodiaz1256
  repo: scranton-branch

# Bake the update toast's "What's new" list straight into latest*.yml.
#
# Without this, electron-updater has nothing to read: parseUpdateInfo yaml-loads
# the channel file, finds releaseNotes null, and falls back to computeReleaseNotes
# over GitHub's releases.atom feed. That feed carries GitHub's RENDERED HTML of
# RELEASE.md, not its markdown, so the digest sees no `##` headings at all and
# scans for bullets instead. The only line in 53KB that looks like a bullet is
# `* { box-sizing: border-box; }` inside RELEASE.md's <style> block, so the
# toast's entire what's-new list was one CSS rule.
#
# A present releaseNotes means the feed is never consulted. That is the whole
# point: the toast is drawn by the ALREADY RUNNING app, so a parser fix reaches
# only people who have already upgraded, while this is a field every existing
# client on every old version already reads.
#
# Keep this file short and free of HTML. It is sized for a 340px toast (5
# bullets, 280 chars total), NOT for the release page, which stays RELEASE.md.
releaseInfo:
  releaseNotesFile: build/release-notes.md

# Notarize + staple after signing, but only when APPLE_* creds are in the env
# (the hook no-ops otherwise, so contributor builds still work). Root-level hook.
afterSign: build/notarize.cjs

# Register the munderdifflin:// URL scheme (shareable-hires deep link) in the
# packaged app: CFBundleURLTypes on macOS, registry entries via NSIS on Windows.
protocols:
  - name: Scranton Branch hire link
    schemes:
      - munderdifflin

# electron-vite emits the app into out/; package exactly that plus what the
# runtime needs. node-pty is native, so keep it out of the asar.
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # v0.3.4: shipped so the voice get_app_info tool can read release notes.
  - CHANGELOG.md
  - "!**/*.{md,map,ts,tsx}"
  - "!**/{.eslintrc,.prettierrc,tsconfig*.json,electron.vite.config.*}"
  # Vite also emits ONNX Runtime's wasm under assets/ (from a URL inside the
  # library), but the voice worker points ORT at out/renderer/ort/ before it
  # loads; that 25.6 MB copy is never read.
  - "!out/renderer/assets/ort-wasm-*.wasm"
  # Native modules: ship the built binaries, not the compiler's leftovers
  # (object files, link-time data, build logs, the sources they came from).
  - "!**/node_modules/node-pty/build/deps/**"
  - "!**/node_modules/node-pty/build/Release/obj/**"
  - "!**/node_modules/node-pty/build/**/*.{iobj,ipdb,pdb,lib,exp,map,tlog}"
  - "!**/node_modules/node-pty/{deps,src}/**"
  - "!**/node_modules/better-sqlite3/{deps,src}/**"
  - "!**/node_modules/better-sqlite3/build/{deps,Release/obj,Release/.deps}/**"

# Ship the standalone Slack reply helper as a plain file under the app's
# resources dir (process.resourcesPath). It runs under `node`, NOT inside the
# asar, so the office worker can invoke `node <resources>/md-slack-reply.cjs`.
extraResources:
  # The licence and the credits the Apache License asks to travel with every copy.
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: LICENSES/MIT-munder-difflin.txt
    to: LICENSES/MIT-munder-difflin.txt
  - from: resources/md-slack-reply.cjs
    to: md-slack-reply.cjs
  # Knowledge Graph agent CLI + its pure-JS core. Agents invoke `node
  # <resources>/kg.cjs` out-of-process; kg-core.cjs ships beside it so the CLI's
  # `require('./kg-core.cjs')` resolves outside the asar.
  - from: resources/kg.cjs
    to: kg.cjs
  - from: src/main/kg-core.cjs
    to: kg-core.cjs
  # Bundled default skills (read-only/no-secret). copyBundledSkills() reads these
  # from skillsResourceDir() = <process.resourcesPath>/skills in the packaged app
  # and refreshes each agent's .claude/skills/ per spawn (dev resolves to
  # repo resources/skills). Directory copy preserves the <id>/SKILL.md tree.
  - from: resources/skills
    to: skills

# Chromium's own UI strings (context menus, dialogs): only the languages the
# app speaks. The other ~50 locale packs were ~40 MB on disk.
electronLanguages:
  - en-US
  - es
  - es-419

asarUnpack:
  - "**/node_modules/node-pty/**"
  # better-sqlite3 is native (bindings/prebuild need the .node on the real FS).
  - "**/node_modules/better-sqlite3/**"

# Rebuild native deps (node-pty) for the target during packaging.
npmRebuild: true

# ---- macOS ----
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Declare WHY the app touches the user's folders. macOS shows these strings in
  # the privacy prompt and, for a signed app, remembers the grant — so the user
  # is asked ONCE instead of on every agent action.
  extendInfo:
    NSDocumentsFolderUsageDescription: "Scranton Branch runs your Claude Code agents, which read and write files in the project folders you point them at."
    NSDesktopFolderUsageDescription: "Scranton Branch's agents may work on projects located on your Desktop."
    NSDownloadsFolderUsageDescription: "Scranton Branch's agents may work on projects located in your Downloads."
    NSRemovableVolumesUsageDescription: "Scranton Branch's agents may work on projects located on external volumes."
    NSNetworkVolumesUsageDescription: "Scranton Branch's agents may work on projects located on network volumes."
    # The microphone is used by two opt-in, off-by-default voice features: Free
    # Flow dictation (Groq transcription) and Realtime Michael (live voice chat
    # with the orchestrator via OpenAI). Mic access only happens while one is on.
    NSMicrophoneUsageDescription: "Scranton Branch uses your microphone only for its opt-in voice features: Free Flow dictation (transcribed by Groq into the message queue) and talking to Michael in real time (streamed to OpenAI). The mic is off unless you turn one of these on."
  # Hardened runtime + entitlements so the spawned `claude` agents inherit this
  # app's TCC responsibility (one grant covers them all) and node-pty can load.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Disable electron-builder's BUILT-IN notarization. It auto-triggers whenever the
  # APPLE_* env vars are present and runs inside signApp — a path our afterSign hook's
  # try/catch can't guard, so a bad-credential failure there hard-fails the whole
  # release (exactly what bit us). Instead, the root-level `afterSign: build/notarize.cjs`
  # hook does notarization best-effort: it tries, and on failure ships the signed (un-
  # notarized) build rather than sinking the cross-platform release. Notarization
  # resumes automatically once the APPLE_* secrets are valid — no further changes.
  notarize: false
  # Signing: TCC binds a remembered grant to a STABLE code signature, so a signed
  # build is asked for folder access ONCE. The "Developer ID Application" cert is
  # auto-discovered from the login keychain (CSC_IDENTITY_AUTO_DISCOVERY). If no
  # cert is found, electron-builder warns and produces an unsigned build, so
  # contributors without an Apple account can still build.
  #   To sign: install your "Developer ID Application" cert into the keychain.
  #   (Override with CSC_LINK=<path-to.p12> + CSC_KEY_PASSWORD for CI.)
  # Notarization happens in the root-level `afterSign` hook (top of this file).
  # dmg is what humans download; zip is what Squirrel.Mac (electron-updater)
  # actually updates from — latest-mac.yml points at it. Both universal.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: Scranton-Branch-${version}-mac-${arch}.${ext}
  # better-sqlite3 13 ships every platform's prebuilt .node in one package, and
  # node-pty keeps per-arch builds (prebuilds/, bin/<platform>-<arch>-<abi>/),
  # so these arch-named files are the same in the x64 and arm64 halves of the
  # universal app; the merge must be told, or it fails. The other platforms'
  # prebuilds are left out of each installer.
  x64ArchFiles: "**/node_modules/{better-sqlite3,node-pty}/{prebuilds,bin}/**/*.node"
  files:
    - "!**/node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,win32}-*.node"
    - "!**/node_modules/node-pty/prebuilds/win32-*/**"

dmg:
  title: Scranton Branch ${version}

# ---- Windows ----
win:
  icon: build/icon.ico
  # The extra uninstaller that does not run the NSIS one (blocked by endpoint
  # security software). Shipped next to the app
  # and offered in the Start Menu by build/installer.nsh.
  extraResources:
    - from: tools/windows/uninstall-scranton-branch.cmd
      to: uninstall-scranton-branch.cmd
    - from: tools/windows/uninstall-scranton-branch.ps1
      to: uninstall-scranton-branch.ps1
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  files:
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node"
    - "!**/node_modules/better-sqlite3/prebuilds/win32-arm64.node"
    - "!**/node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**"

# Windows installers are compiled with a current NSIS (3.11), not the 2018
# 3.0.4.1 electron-builder 25 downloads: that one's System.dll plugin crashes
# the setup at launch (0xc0000005) on current Windows 11 builds, which only
# ran in Windows 8 compatibility mode. release.yml points
# ELECTRON_BUILDER_NSIS_DIR at it. Its stricter makensis warns about language
# strings electron-builder's templates leave untranslated (e.g. Korean
# multi-user titles, falling back to English), so warnings are not fatal.
nsis:
  include: build/installer.nsh
  warningsAsErrors: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Scranton-Branch-${version}-win-x64-setup.exe
  shortcutName: Scranton Branch

portable:
  artifactName: Scranton-Branch-${version}-win-x64-portable.exe

# ---- Linux ----
linux:
  category: Development
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  artifactName: Scranton-Branch-${version}-linux-x86_64.AppImage
  files:
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,win32,linuxmusl}-*.node"
    - "!**/node_modules/better-sqlite3/prebuilds/linux-arm64.node"
    - "!**/node_modules/node-pty/prebuilds/{darwin-*,win32-*}/**"
